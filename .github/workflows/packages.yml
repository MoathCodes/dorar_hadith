name: Package verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Restore core dependency lock
        shell: bash
        run: cp .github/locks/dorar_hadith.lock pubspec.lock
      - run: dart pub get --enforce-lockfile
      - run: dart analyze
      - run: dart test
      - name: Verify generated sources
        shell: bash
        run: |
          dart run build_runner build
          git diff --exit-code -- 'lib/**/*.g.dart' 'lib/**/*.freezed.dart'
      - name: Configure local adapter development dependency
        shell: bash
        run: |
          cp .github/locks/dorar_hadith_flutter.lock dorar_hadith_flutter/pubspec.lock
          cat > dorar_hadith_flutter/pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            dorar_hadith:
              path: ..
          YAML
      - run: flutter pub get --no-example --enforce-lockfile
        working-directory: dorar_hadith_flutter
      - run: flutter analyze --no-pub lib test
        working-directory: dorar_hadith_flutter
      - run: flutter test --no-pub
        working-directory: dorar_hadith_flutter
  minimum-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0'
      - run: dart pub downgrade
      - run: dart analyze
      - run: dart test
  browser-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: dart pub get
      - name: Configure independent example
        shell: bash
        run: |
          cat > dorar_hadith_flutter/example/pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            dorar_hadith:
              path: ../..
            dorar_hadith_flutter:
              path: ..
          YAML
      - name: Build matching WebAssembly worker
        run: dart compile js tool/drift_worker.dart -o dorar_hadith_flutter/example/web/drift_worker.dart.js
      - name: Fetch and verify SQLite WebAssembly
        shell: bash
        run: |
          curl -fsSL https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-3.7.0/sqlite3.wasm -o dorar_hadith_flutter/example/web/sqlite3.wasm
          echo 'fbcd2e8214f9231ea961e1b7706a22dd1194cfbfe6f26f13841b5aa7a0be1a1f  dorar_hadith_flutter/example/web/sqlite3.wasm' | sha256sum -c -
      - run: flutter pub get
        working-directory: dorar_hadith_flutter/example
      - run: flutter analyze --no-pub lib test
        working-directory: dorar_hadith_flutter/example
      - run: flutter test --no-pub
        working-directory: dorar_hadith_flutter/example
      - run: flutter build web
        working-directory: dorar_hadith_flutter/example
