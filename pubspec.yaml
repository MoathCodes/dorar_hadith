name: dorar_hadith
description: >-
  A Dart library for accessing the Dorar.net hadith database.
  Search hadiths, get explanations (sharh), browse scholars, books, and narrators.
version: 0.6.1
homepage: https://github.com/MoathCodes/dorar_hadith
repository: https://github.com/MoathCodes/dorar_hadith
issue_tracker: https://github.com/MoathCodes/dorar_hadith/issues
documentation: https://pub.dev/documentation/dorar_hadith/latest/

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
  web:

topics:
  - hadith
  - islamic
  - dorar
  - arabic
  - religion

# Mark known false-positive secrets in test fixtures (captured from external site).
# See https://dart.dev/go/false-secrets
false_secrets:
  - test/fixtures/api_snapshots/**

environment:
  sdk: ">=3.13.0 <4.0.0"

# Add regular dependencies here.
dependencies:
  crypto: ^3.0.7
  equatable: ^2.1.0
  html: ^0.15.7
  http: ^1.6.0
  drift: ^2.35.0
  sqlite3: ^3.6.0
  path: ^1.9.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  lints: ^6.1.0
  test: ^1.32.0
  # Older transitive versions assume a removed Dart frontend-server snapshot.
  frontend_server_client: ^4.0.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  assets:
    - assets/data/
    - assets/database/
